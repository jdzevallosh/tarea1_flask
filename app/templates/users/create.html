{% extends 'base.html' %}

{% block content %}
<h2>Nuevo Usuario</h2>

<form action="{{ url_for('create_user') }}" method="POST">
    <p>DNI: <input type="text" name="dni" required></p>
    <p>Nombres: <input type="text" name="given_name" required></p>
    <p>Apellidos: <input type="text" name="family_name" required></p>
    <p>Email: <input type="email" name="email" required></p>
    <p>Teléfono: <input type="text" name="phone_number"></p>
    <p>Dirección: <input type="text" name="address"></p>
    <button type="submit">Guardar</button>
</form>
{% endblock %}
