{% extends 'base.html' %}

{% block content %}
<h2>Usuarios</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>DNI</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Acciones</th>
    </tr>
    {% for user in users %}
    <tr>
        <td>{{ user['id'] }}</td>
        <td>{{ user['dni'] }}</td>
        <td>{{ user['given_name'] }} {{ user['family_name'] }}</td>
        <td>{{ user['email'] }}</td>
        <td>
            <a href="{{ url_for('get_user', id=user['id']) }}">Ver</a>
            <a href="{{ url_for('edit_user', id=user['id']) }}">Editar</a>
            <form action="{{ url_for('delete_user', id=user['id']) }}" method="POST" style="display:inline;">
                <button type="submit">Borrar</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
